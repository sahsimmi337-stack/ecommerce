<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amazon clone</title>
    <link rel="stylesheet" href="style1.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <title>Amazon Clone - Cart</title>
    <style>
        .cart-container {
            background-color: white;
            margin: 30px;
            padding: 25px;
        }

        .cart-container h1 {
            font-size: 28px;
            margin-bottom: 20px;
        }

        .cart-summary {
            text-align: right;
            margin-top: 30px;
            border-top: 1px solid #ddd;
            padding: 20px;
        }

        #place-order {
            background-color: #ffd814;
            border: none;
            padding: 12px 30px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 16px;
            margin-top: 15px;
        }
            .total-value {
            font-size: 32px;
            font-weight: bold;
        }
        .cart-item {
        display: flex;
        gap: 25px;
        padding: 20px 0;
        border-bottom: 1px solid #ddd;
    }

        .cart-image {
            width: 180px;
            height: 180px;
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
        }

        .cart-details {
            flex: 1;
        }

        .cart-details h2 {
            margin-bottom: 10px;
        }

        .cart-details p {
            margin: 5px 0;
        }

        .cart-details button {
            margin-top: 10px;
            padding: 8px 15px;
            cursor: pointer;
        }
            .cart-item {
            display: flex;
            align-items: center;
            gap: 25px;
            padding: 20px 0;
            border-bottom: 1px solid #ddd;
        }

        .cart-image {
            width: 150px;
            height: 150px;
            object-fit: contain;
        }

        .cart-product-info {
            flex: 1;
        }

        .cart-price {
            margin: 10px 0;
        }

        .quantity-section {
            display: flex;
            align-items: center;
            gap: 15px;
            margin: 15px 0;
        }

        .quantity-btn {
            width: 35px;
            height: 35px;
            font-size: 22px;
            cursor: pointer;
            border: 1px solid #aaa;
            background: #fff;
        }

        .quantity {
            font-size: 18px;
            font-weight: bold;
        }

        .item-total {
            font-weight: bold;
            margin: 10px 0;
        }

        .remove-btn {
            background: #e7e7e7;
            border: 1px solid #999;
            padding: 8px 15px;
            cursor: pointer;
        }

        .remove-btn:hover {
            background: #ddd;
        }

        .empty-cart {
            text-align: center;
            padding: 50px;
        }
        .order-popup {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.6);
        justify-content: center;
        align-items: center;
        z-index: 1000;
    }

    .popup-box {
        background: white;
        width: 400px;
        padding: 40px;
        text-align: center;
        border-radius: 10px;
    }

    .success-icon {
        width: 60px;
        height: 60px;
        background: #00a650;
        color: white;
        border-radius: 50%;
        font-size: 40px;
        margin: 0 auto 20px;
        line-height: 60px;
    }

    .popup-box h2 {
        margin-bottom: 15px;
    }

    .popup-box p {
        color: #555;
        margin-bottom: 25px;
    }

    #continue-shopping {
        background-color: #ffd814;
        border: none;
        padding: 12px 25px;
        border-radius: 20px;
        cursor: pointer;
        font-size: 16px;
    }

    #continue-shopping:hover {
        background-color: #f7ca00;
    }
    .back-home{
        position: fixed;
        bottom: 0;
        display: flex;
        width: 100%;
    }
    
    </style>
</head>

<body id="top">

    <!-- NAVBAR -->
    <header>

        <div class="navbar">

            <div class="nav-logo border" onclick="window.location.href='home.html'">
                <div class="logo"></div>
            </div>

            <div class="nav-address border">
                <p class="add-first">Deliver to</p>

                <div class="add-icon">
                    <i class="fa-solid fa-location-dot"></i>
                    <p class="add-second">India</p>
                </div>
            </div>

            <div class="nav-search">

                <select class="search-select" id="category">
                    <option>All</option>
                    <option>Clothes</option>
                    <option>Skin Care</option>
                    <option>Furniture</option>
                    <option>Electronics</option>
                    <option>Make-up</option>
                    <option>Home Decor</option>
                    <option>Books</option>
                    <option>Fashion</option>
                </select>

                <input
                    class="search-input"
                    type="text"
                    id="searchInput"
                    placeholder="Search Amazon">

                <div class="search-icon" id="searchButton">
                    <i class="fa-solid fa-magnifying-glass"></i>
                </div>

            </div>

            <div class="nav-signin border">
                <p><span>Hello, Sign in</span></p>
                <p class="nav-second">Account & Lists</p>
            </div>

            <div class="nav-return border">
                <p><span>Returns</span></p>
                <p class="nav-second">& orders</p>
            </div>

            <div class="nav-cart">
                <i class="fa-solid fa-cart-shopping"></i>
                Cart
            </div>

        </div>

    </header>


    <!-- CART -->
    <div class="cart-container">

        <h1>Shopping Cart</h1>

        <div id="cart-items">
            <!-- Products will appear here -->
        </div>

        <div class="cart-summary">

            <h2>
                Subtotal: ₹<span id="total" class="total-value">0</span>
            </h2>

            <button id="place-order">
                Place Your Order
            </button>

        </div>

    </div>
    <div>
         
        <a href="home.html" class="back-home">
            Back to home
        </a>
    </div>
    <div id="order-popup" class="order-popup">

    <div class="popup-box">

        <div class="success-icon">
            ✓
        </div>

        <h2>Order Placed Successfully!</h2>

        <p>
            Thank you for shopping with Amazon Clone.
        </p>

        <button id="continue-shopping">
            Continue Shopping
        </button>

    </div>

    </div>


    <!-- JAVASCRIPT -->
    <script src="script.js"></script>

</body>
</html>
